[package]
name = "oxide"
version = "0.6.0"
edition = "2021"
description = "Oxide - a lightweight HTTP client"

[dependencies]
iced = { version = "0.14", features = ["tokio", "advanced", "highlighter", "image-without-codecs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "gzip", "brotli", "deflate"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
dirs = "6"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg", "gif", "webp", "bmp"] }
p12-keystore = "0.4.1"
pem = "4.0.0"
hayro = "0.9.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
